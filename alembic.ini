# Alembic configuration at the repository root.
#
# Alembic resolves its ini relative to the current working directory only and
# does not search parent directories. Without this file a documented
# "python -m alembic heads" from the repository root fails with
# "No 'script_location' key found in configuration".
#
# %(here)s is this file's own directory, so pointing at migrations/ keeps the
# resolution correct no matter where the command is invoked from. The copy in
# migrations/ stays for callers that cd into it.

[alembic]
script_location = %(here)s/migrations
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
