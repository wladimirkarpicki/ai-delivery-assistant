name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

# Least privilege: no SARIF is uploaded here (the dynamic CodeQL workflow
# already handles code scanning), so security-events: write is not requested.
permissions:
  contents: read

jobs:
  sast:
    name: Static Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs, not mutable tags: a
      # retagged or compromised release would otherwise be picked up
      # silently. The version stays in the comment for humans.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned to the version this gate was verified against.
          pip install bandit==1.9.4
      # Scans the whole tree so a new module cannot silently drop out of
      # coverage. Rest runs exit-zero and only records the report.
      - name: Run Bandit SAST (report)
        run: |
          python -m bandit \
            -r . \
            -x ./.venv,./frontend/node_modules,./migrations,./scripts \
            --exit-zero \
            -f txt -o bandit.txt || true
      # The gate itself: a HIGH severity finding fails the build.
      - name: Run Bandit SAST (gate)
        run: |
          python -m bandit \
            -r . \
            -x ./.venv,./frontend/node_modules,./migrations,./scripts \
            --severity-level high \
            -f txt
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-report
          path: bandit.txt
          retention-days: 30
          if-no-files-found: ignore

  sca:
    name: Dependency Scan (Safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned to the version this gate was verified against.
          pip install safety==3.8.1
      # No "|| true": a vulnerable or unpinned dependency must fail CI.
      - name: Run Safety SCA
        run: |
          safety check --file requirements.txt --output json > safety.json
        shell: bash
      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safety-report
          path: safety.json
          retention-days: 30
          if-no-files-found: ignore

  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned from requirements.txt so this gate matches local runs.
          pip install -r requirements.txt
      - name: Run Ruff
        run: ruff check --output-format=github .

  typecheck:
    name: Type Checking (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt first: api.py imports PyJWT and werkzeug, and a
          # bare mypy install leaves them unresolved. mypy is pinned to the
          # version this gate was verified against.
          pip install -r requirements.txt
          pip install mypy==2.4.1
      # No "|| true": a type error is a failure, not a note. Coverage is now
      # every root module, not the five that used to be scanned.
      - name: Run Mypy
        run: |
          mypy api.py database.py models.py document_parser.py analyzer.py \
            matching.py project_memory.py memory_consolidator.py report.py \
            router.py config_loader.py config.py

  test:
    name: Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # The suite was committed but never executed in CI before this.
      # Coverage is reported, not gated: the current 82% total hides a 41%
      # in project_memory.py, and a threshold would lock that in rather
      # than surface it. Raise it deliberately once that module is covered.
      - name: Run Pytest
        run: python -m pytest -q --cov=. --cov-report=term-missing

  migrations:
    name: Migrations (Alembic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The documented invocation, from the repository root, is the one
      # that used to fail: alembic only reads the ini next to the current
      # working directory, and there was none at the root.
      - name: Alembic heads from the repo root
        run: python -m alembic heads
      - name: Alembic history from the repo root
        run: python -m alembic history
      # Every revision file on disk must appear in the chain, so an
      # unregistered or orphaned migration fails CI rather than being
      # discovered during a deploy.
      - name: Migration chain covers every revision file
        run: |
          set -euo pipefail
          # "--" before the first pattern and "-e" before the second: grep
          # would otherwise read the leading "-" of "->" as an option.
          on_disk=$(ls migrations/versions/*.py | grep -vc -- '/env.py$' || true)
          in_chain=$(python -m alembic history | grep -c -e '->' || true)
          echo "revision files on disk: $on_disk"
          echo "revisions in the chain: $in_chain"
          if [ "$on_disk" != "$in_chain" ]; then
            echo "::error::migration chain does not match the files on disk"
            exit 1
          fi
          echo "chain is complete and covers every file"

  frontend-audit:
    name: Frontend Audit (pnpm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.7.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No "|| true": a HIGH advisory must fail the build.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  frontend-typecheck:
    name: Frontend Typecheck and Build
    runs-on: ubuntu-latest
    needs: frontend-audit
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.7.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Uses the project's own typecheck script: a bare "tsc --noEmit"
      # resolves the solution tsconfig and checks nothing at all.
      - name: Typecheck
        run: pnpm run typecheck
      # The tests are a gate, not a footnote: they cover the formatters the
      # pages render with, the auth copy's refusal to grant a capability the
      # server never issued, the cookie contract, the 401 redirect, and the
      # 404 body's keyboard and heading roles.
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
