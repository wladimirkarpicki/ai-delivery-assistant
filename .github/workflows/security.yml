name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

# Least privilege: no SARIF is uploaded here (the dynamic CodeQL workflow
# already handles code scanning), so security-events: write is not requested.
permissions:
  contents: read

jobs:
  sast:
    name: Static Analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      # Scans the whole tree so a new module cannot silently drop out of
      # coverage. Rest runs exit-zero and only records the report.
      - name: Run Bandit SAST (report)
        run: |
          python -m bandit \
            -r . \
            -x ./.venv,./frontend/node_modules,./migrations,./scripts \
            --exit-zero \
            -f txt -o bandit.txt || true
      # The gate itself: a HIGH severity finding fails the build.
      - name: Run Bandit SAST (gate)
        run: |
          python -m bandit \
            -r . \
            -x ./.venv,./frontend/node_modules,./migrations,./scripts \
            --severity-level high \
            -f txt
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit.txt
          retention-days: 30
          if-no-files-found: ignore

  sca:
    name: Dependency Scan (Safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety
      # No "|| true": a vulnerable or unpinned dependency must fail CI.
      - name: Run Safety SCA
        run: |
          safety check --file requirements.txt --output json > safety.json
        shell: bash
      - name: Upload Safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety.json
          retention-days: 30
          if-no-files-found: ignore

  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff
        run: ruff check --output-format=github .

  typecheck:
    name: Type Checking (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy sqlalchemy pydantic fastapi starlette alembic psycopg pydantic-settings python-dotenv httpx tenacity python-multipart python-docx pypdf
      # No "|| true": a type error is a failure, not a note. Coverage is now
      # every root module, not the five that used to be scanned.
      - name: Run Mypy
        run: |
          mypy api.py database.py models.py document_parser.py analyzer.py \
            matching.py project_memory.py memory_consolidator.py report.py \
            router.py config_loader.py config.py document_parser_constants.py

  test:
    name: Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # The suite was committed but never executed in CI before this.
      - name: Run Pytest
        run: python -m pytest -q

  frontend-audit:
    name: Frontend Audit (pnpm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # No "|| true": a HIGH advisory must fail the build.
      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  frontend-typecheck:
    name: Frontend Typecheck and Build
    runs-on: ubuntu-latest
    needs: frontend-audit
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Uses the project's own typecheck script: a bare "tsc --noEmit"
      # resolves the solution tsconfig and checks nothing at all.
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
