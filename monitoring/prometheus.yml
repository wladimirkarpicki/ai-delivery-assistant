global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'ai-delivery-assistant'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ai-delivery-assistant'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
