global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'ai-delivery-assistant'

# Alerting rules, mounted from ./monitoring/alerts.yml by compose.yml
# (prometheus service volumes). Prometheus resolves rule_files paths
# inside the container, hence /etc/prometheus/alerts.yml, matching the
# mount target ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ai-delivery-assistant'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
