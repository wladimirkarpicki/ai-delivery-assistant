# A generic, single database configuration.
#
# Alembic looks for this file relative to the current working directory
# only: it does not search parent directories. A bare
# "python -m alembic heads" from the repository root is served by the
# alembic.ini at the repository root, which points script_location back
# here, so all of these forms work:
#   python -m alembic heads
#   cd migrations && python -m alembic heads
#   python -m alembic -c migrations/alembic.ini heads
#   $env:ALEMBIC_CONFIG = "alembic.ini"; python -m alembic heads
# %(here)s is the substitution token for this file's own directory, so
# script_location resolves to migrations/ regardless of the caller's
# working directory.

[alembic]
# The migration scripts live in this directory (the ini sits inside it).
script_location = %(here)s
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
