# Compose for ai-delivery-assistant — analogous to inventory-management-system
# Run: docker compose up -d
# Monitor: docker compose --profile monitoring up -d
#
# Required environment variables (put them in .env, which is gitignored):
#   DATABASE_USER, DATABASE_PASSWORD, DATABASE_NAME
#   JWT_SECRET_KEY   (python -c "import secrets; print(secrets.token_hex(32))")
#   OPENROUTER_API_KEY
#   BOOTSTRAP_TOKEN  (one-time token gating POST /api/auth/setup)
#   GRAFANA_ADMIN_PASSWORD  (only with --profile monitoring)
# Copy .env.example to .env and fill them in. There are no default values for
# any of these: the stack refuses to start rather than run with known creds.

services:
  db:
    image: postgres:16
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required - copy .env.example to .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required - copy .env.example to .env}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required - copy .env.example to .env}
    volumes:
      # pgdata_ai2: fresh volume; the old pgdata_ai got filesystem corruption
      # (EBADMSG on base/16384/24680-24681) after unclean Docker Desktop
      # shutdowns on the external D: drive. Old volume left orphaned for
      # safe cleanup later — do not rename back.
      - pgdata_ai2:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:?required} -d ${DATABASE_NAME:?required}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: ${DATABASE_NAME:?required}
      DATABASE_USER: ${DATABASE_USER:?required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?required}
      DATABASE_URL: postgresql+psycopg://${DATABASE_USER:?required}:${DATABASE_PASSWORD:?required}@${DATABASE_HOST:-db}:5432/${DATABASE_NAME:?required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required - copy .env.example to .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - copy .env.example to .env}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      AIDA_ENV: ${AIDA_ENV:-production}
    # Loopback only: POST /api/auth/setup creates the first admin, so the
    # port must not be reachable from outside this machine.
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Monitoring profile: only started with --profile monitoring
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata_ai:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["monitoring"]
    restart: unless-stopped
    networks:
      - backend
    # Loopback only: no credentials default to admin/admin any more.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Loopback only: no credentials default to admin/admin any more.
      # This service is behind --profile monitoring, so its variable must
      # not be a hard requirement: a mandatory ${VAR:?} here fails a plain
      # "docker compose up" for a service that is not even starting.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
    volumes:
      - grafdata_ai:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  pgdata_ai2:
  promdata_ai:
  grafdata_ai:
