<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}AI Delivery Assistant{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body><main class="container"><header><a class="brand" href="{{ url_for('projects') }}">AI Delivery Assistant</a><p>Auditable delivery memory from every meeting.</p></header>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
