{% extends "base.html" %}

{% block content %}

<div class="page-heading">
    <div>
        <a href="{{ url_for('project_overview', project_id=project.id) }}">← {{ project.name }}</a>
        <span class="eyebrow">New evidence</span>
        <h1>Add meeting</h1>
        <p>Upload or paste the source record. Analysis stays attached to this project.</p>
    </div>
</div>

{% if error %}
    <div class="notice error">
        {{ error }}
    </div>
{% endif %}

<form
    method="post"
    enctype="multipart/form-data"
>
    <label>
        Meeting title

        <input
            name="title"
            maxlength="250"
            placeholder="Weekly delivery meeting"
        >
    </label>

    <label>
        Upload notes
        <span>PDF, DOCX, TXT, or Markdown (max 20 MB)</span>

        <input
            type="file"
            name="meeting_file"
            accept=".pdf,.docx,.txt,.md"
        >
    </label>

    <p class="hint">
        Or paste notes below.
    </p>

    <label>
        Meeting notes

        <textarea
            name="meeting_notes"
            rows="14"
        ></textarea>
    </label>

    <button
        type="submit"
        {% if not analysis_ready %}disabled{% endif %}
    >
        Analyze and save
    </button>
</form>


{% endblock %}
